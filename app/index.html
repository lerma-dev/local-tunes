<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Tu reproductor de música local, diseñado para la privacidad y la gestión eficiente de tu biblioteca personal sin rastreadores." />
    <meta name="theme-color" content="#201c4f" />
    <title>Local Tunes</title>
    <style>
      .loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #130e47;
        z-index: 9999;
        font-family: system-ui, -apple-system, sans-serif;
        color: #fff;
        opacity: 1;
        transition: opacity .9s ease-out;
      }
      .loading-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .loading-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 2rem;
        max-width: 400px;
      }
      .loading-logo {
        width: 96px;
        height: 96px;
        margin-bottom: 1.25rem;
        filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.4));
      }
      .loading-title {
        font-size: 1.25rem;
        font-weight: 700;
        margin: 0 0 0.5rem 0;
        background: linear-gradient(135deg, #70f9f3, #325ed8, #eb81ff);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .loading-subtitle {
        font-size: 0.875rem;
        line-height: 1.4;
        color: #c6cacf;
        margin: 0 0 1.5rem 0;
      }
    </style>
    <!-- Favicon y estilos principales -->
    <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg" />
    <link rel="stylesheet" href="./styles/main.css" />
    <!-- ANDROID -->
    <link rel="manifest" href="./manifest.json" />
    <!-- IOS -->
    <link rel="apple-touch-icon" href="./assets/icons/icon-180.webp" />
    <meta name="apple-mobile-web-app-title" content="L-Tunes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="#201c4f" />
  </head>
  <body>
    <div id="loading-screen" class="loading-screen">
      <div class="loading-content">
        <img src="./assets/icons/animate-icon.svg" alt="Local Tunes Logo" class="loading-logo" />
        <h1 class="loading-title">Local Tunes</h1>
        <p class="loading-subtitle">
          Tu reproductor de música local, diseñado para la privacidad y la gestión eficiente de tu biblioteca personal sin rastreadores.
        </p>
      </div>
    </div>
    
    <div id="app"></div>
    <audio id="audio-engine"></audio>

    <!-- javascripts -->
    <script type="module" src="./scripts/app.js"></script>
    <script>
      const hostname = window.location.hostname;
      const isLocal = hostname === "localhost" || hostname === "127.0.0.1";
      if (isLocal) {
        console.info("Service Worker: Desactivado en entorno local.");
      } else if ("serviceWorker" in navigator) {
        /*
          Registro del Service Worker 
          Recarga automática cuando el nuevo SW toma el control
        */
        navigator.serviceWorker.register("./sw.js");
        
        let refreshing = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      }
      requestAnimationFrame(() => {
        const loadingScreen = document.getElementById("loading-screen");
        if (loadingScreen) {
          loadingScreen.classList.add("fade-out");
          setTimeout(() => loadingScreen.remove(), 900);
        }
      });
      const version = async () => {
        try {
          const res = await fetch("./manifest.json");
          const data = await res.json();
          localStorage.setItem("AppVersion", data.version);
        }catch (e) {
          console.error("Error al obtener la versión:", e);
        }
      };
      version();
    </script>
  </body>
</html>
