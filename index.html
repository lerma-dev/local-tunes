<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Tu reproductor de música local, diseñado para la privacidad y la gestión eficiente de tu biblioteca personal sin rastreadores." />
    <meta name="theme-color" content="#201c4f" />
    <title>Local Tunes</title>
    <script>
      requestAnimationFrame(() => {
        const loadingScreen = document.getElementById("loading-screen");
        if (loadingScreen) {
          loadingScreen.classList.add("fade-out");
          setTimeout(() => loadingScreen.remove(), 1000);
        }
      });
      if (window.chrome && window.chrome.webview) {
        document.documentElement.classList.add("native-app");
      }
      const version = async () => {
        try {
          const res = await fetch("./version.json");
          const data = await res.json();
          localStorage.setItem("AppVersion", data.version);
          localStorage.setItem("AppCodename", data.codename );
        }catch (e) {
          console.error("Error al obtener la versión:", e);
        }
      };
      version();
    </script>
    <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/loading.css"/>
    <link rel="stylesheet" href="./styles/layouts/desktop-titlebar.css" />
    <!-- ANDROID -->
    <link rel="manifest" href="./manifest.json" />
    <!-- IOS -->
    <link rel="apple-touch-icon" href="./assets/icons/icon-180.webp" />
    <meta name="apple-mobile-web-app-title" content="L-Tunes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="#201c4f" />
  </head>
  <body>
    <div id="loading-screen" class="loading-screen">
      <div class="loading-content">
        <img src="./assets/icons/animate-icon.svg" alt="Local Tunes Logo" class="loading-logo" />
        <h1 class="loading-title">Local Tunes</h1>
        <p class="loading-subtitle">
          Tu reproductor de música local, diseñado para la privacidad y la gestión eficiente de tu biblioteca personal sin rastreadores.
        </p>
      </div>
    </div>
    
    <div id="app"></div>
    <audio id="audio-engine"></audio>

    <!-- javascripts -->
    <script src="./scripts/icons.js"></script>
    <script type="module" src="./scripts/app.js"></script>
    <script src="./register_sw.js"></script>
  </body>
</html>
